name: ci
on:
  push:
    branches: [main, testing, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, testing]
jobs:
  python-quality:
    uses: myota-platform/.github/.github/workflows/python-quality.yml@main
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  container:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref_name == 'testing'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags
        id: image-tags
        env:
          IMAGE_NAME: ghcr.io/myota-platform/myota-platform-ci
        run: |
          if [[ "${GITHUB_REF_NAME}" == "testing" ]]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:testing"
              echo "${IMAGE_NAME}:testing-${GITHUB_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE_NAME}:ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref_name == 'testing' }}
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
