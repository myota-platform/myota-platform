global:
  resolve_timeout: 5m

route:
  receiver: myota-local
  group_by: [alertname, severity, service_name, http_route, http_request_method]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# The local profile deliberately stores and exposes alerts without sending
# them to an invented external address. Production deployments should replace
# this receiver with their real email, chat, paging, or webhook integration.
receivers:
  - name: myota-local
