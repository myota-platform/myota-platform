global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: nats-surveyor
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: [nats-surveyor:7777]
  # The collector is the single scrape boundary. It combines service-owned
  # Prometheus endpoints with OTLP metrics before Prometheus stores them.
  - job_name: myota-otel-collector
    static_configs:
      - targets: [otel-collector:8889]
