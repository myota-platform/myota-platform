apiVersion: 1
groups:
  - orgId: 1
    name: myota-api
    folder: MyOTA
    interval: 1m
    rules:
      - uid: myota-grafana-api-errors
        title: MyOTA API 5xx error rate
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: myota-prometheus
            model:
              datasource: {type: prometheus, uid: myota-prometheus}
              editorMode: code
              expr: "sum(rate(myota_http_server_requests_total{http_response_status_code=~\"5..\"}[5m])) / clamp_min(sum(rate(myota_http_server_requests_total[5m])), 0.1)"
              format: time_series
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0.05], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        annotations:
          summary: MyOTA API 5xx error rate is high
          description: The local Prometheus-backed API error rate is above 5%.
        labels: {severity: warning, source: grafana}
      - uid: myota-grafana-api-latency
        title: MyOTA API p95 latency
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: myota-prometheus
            model:
              datasource: {type: prometheus, uid: myota-prometheus}
              editorMode: code
              expr: "histogram_quantile(0.95, sum by (le) (rate(myota_http_server_duration_milliseconds_bucket[5m])))"
              format: time_series
              intervalMs: 15000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [1000], type: gt}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last}
                  type: query
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Alerting
        for: 10m
        annotations:
          summary: MyOTA API p95 latency is high
          description: The local Prometheus-backed API p95 response time is above one second.
        labels: {severity: warning, source: grafana}
