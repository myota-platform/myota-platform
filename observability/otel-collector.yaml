receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  postgresql/core:
    endpoint: core-db:5432
    transport: tcp
    username: myota_observability
    password: ${env:MYOTA_PG_CORE_MONITOR_PASSWORD}
    databases: [myota_core]
    collection_interval: 30s
    tls: {insecure: true}
    metrics:
      postgresql.backends: {enabled: true}
      postgresql.connection.max: {enabled: true}
      postgresql.database.count: {enabled: true}
      postgresql.db_size: {enabled: true}
      postgresql.commits: {enabled: true}
      postgresql.rollbacks: {enabled: true}
      postgresql.blocks_read: {enabled: true}
      postgresql.bgwriter.buffers.allocated: {enabled: true}
      postgresql.bgwriter.buffers.writes: {enabled: true}
      postgresql.bgwriter.checkpoint.count: {enabled: true}
      postgresql.bgwriter.duration: {enabled: true}
      postgresql.bgwriter.maxwritten: {enabled: true}
      postgresql.deadlocks: {enabled: true}
      postgresql.index.scans: {enabled: false}
      postgresql.index.size: {enabled: false}
      postgresql.rows: {enabled: false}
      postgresql.table.size: {enabled: false}
      postgresql.table.vacuum.count: {enabled: false}
  postgresql/activity:
    endpoint: activity-db:5432
    transport: tcp
    username: myota_observability
    password: ${env:MYOTA_PG_ACTIVITY_MONITOR_PASSWORD}
    databases: [myota_activity]
    collection_interval: 30s
    tls: {insecure: true}
    metrics:
      postgresql.backends: {enabled: true}
      postgresql.connection.max: {enabled: true}
      postgresql.database.count: {enabled: true}
      postgresql.db_size: {enabled: true}
      postgresql.commits: {enabled: true}
      postgresql.rollbacks: {enabled: true}
      postgresql.blocks_read: {enabled: true}
      postgresql.bgwriter.buffers.allocated: {enabled: true}
      postgresql.bgwriter.buffers.writes: {enabled: true}
      postgresql.bgwriter.checkpoint.count: {enabled: true}
      postgresql.bgwriter.duration: {enabled: true}
      postgresql.bgwriter.maxwritten: {enabled: true}
      postgresql.deadlocks: {enabled: true}
      postgresql.index.scans: {enabled: false}
      postgresql.index.size: {enabled: false}
      postgresql.rows: {enabled: false}
      postgresql.table.size: {enabled: false}
      postgresql.table.vacuum.count: {enabled: false}
  postgresql/geo:
    endpoint: geo-db:5432
    transport: tcp
    username: myota_observability
    password: ${env:MYOTA_PG_GEO_MONITOR_PASSWORD}
    databases: [myota_geo]
    collection_interval: 30s
    tls: {insecure: true}
    metrics:
      postgresql.backends: {enabled: true}
      postgresql.connection.max: {enabled: true}
      postgresql.database.count: {enabled: true}
      postgresql.db_size: {enabled: true}
      postgresql.commits: {enabled: true}
      postgresql.rollbacks: {enabled: true}
      postgresql.blocks_read: {enabled: true}
      postgresql.bgwriter.buffers.allocated: {enabled: true}
      postgresql.bgwriter.buffers.writes: {enabled: true}
      postgresql.bgwriter.checkpoint.count: {enabled: true}
      postgresql.bgwriter.duration: {enabled: true}
      postgresql.bgwriter.maxwritten: {enabled: true}
      postgresql.deadlocks: {enabled: true}
      postgresql.index.scans: {enabled: false}
      postgresql.index.size: {enabled: false}
      postgresql.rows: {enabled: false}
      postgresql.table.size: {enabled: false}
      postgresql.table.vacuum.count: {enabled: false}
  prometheus:
    config:
      scrape_configs:
        - job_name: myota-services
          scrape_interval: 15s
          static_configs:
            - targets: [gateway:8080, identity:8001, programmes:8002, geodata:8003, activity:8004, operations:8005, activity-notifications:9110]
        - job_name: myota-outbox
          scrape_interval: 15s
          static_configs:
            - targets: [outbox-core:9108, outbox-activity:9108, outbox-geo:9108]
        - job_name: seaweedfs
          scrape_interval: 15s
          static_configs:
            - targets: [seaweedfs:9324]
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
    send_batch_size: 512
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    timeout: 10s
    sending_queue:
      enabled: true
      queue_size: 1024
    retry_on_failure:
      enabled: true
service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus, postgresql/core, postgresql/activity, postgresql/geo]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
