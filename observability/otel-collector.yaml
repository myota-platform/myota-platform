receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: myota-services
          scrape_interval: 15s
          static_configs:
            - targets: [gateway:8080, geodata:8003, activity:8004, operations:8005, activity-notifications:9110]
        - job_name: myota-identity
          scrape_interval: 15s
          static_configs:
            - targets: [identity:8001]
        - job_name: myota-programmes
          scrape_interval: 15s
          static_configs:
            - targets: [programmes:8002]
        - job_name: myota-outbox
          scrape_interval: 15s
          static_configs:
            - targets: [outbox-core:9108, outbox-activity:9108, outbox-geo:9108]
        - job_name: seaweedfs
          scrape_interval: 15s
          static_configs:
            - targets: [seaweedfs:9324]
        - job_name: loki
          scrape_interval: 15s
          static_configs:
            - targets: [loki:3100]
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  transform/drop_db_query_text:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.query.text")
          - delete_key(attributes, "db.query.parameters")
  batch:
    timeout: 5s
    send_batch_size: 512
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    timeout: 10s
    sending_queue:
      enabled: true
      queue_size: 1024
    retry_on_failure:
      enabled: true
service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/drop_db_query_text, batch]
      exporters: [otlp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
