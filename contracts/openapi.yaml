openapi: 3.1.0
info:
  title: MyOTA Outdoor Activation Platform APIs
  version: 1.0.0
  description: Service contracts for a programme-agnostic amateur-radio outdoor activation platform.
servers:
  - url: http://localhost:8080
tags:
  - name: Identity
  - name: Programmes
  - name: Geodata
  - name: Activity
  - name: Awards
paths:
  /v1/identity/auth/register:
    post:
      tags: [Identity]
      summary: Register an operator or SWL and create a session
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterAccount' } } }
      responses: { '201': { description: Registered and authenticated } }
  /v1/identity/auth/login:
    post:
      tags: [Identity]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Login' } } }
      responses: { '200': { description: Authenticated } }
  /v1/identity/auth/refresh:
    post:
      tags: [Identity]
      summary: Rotate a refresh token
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RefreshToken' } } }
      responses: { '200': { description: Rotated session } }
  /v1/identity/auth/logout:
    post:
      tags: [Identity]
      summary: Revoke a session or access token
      security: [{ bearerAuth: [] }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/RefreshToken' } } }
      responses: { '200': { description: Logged out } }
  /v1/identity/auth/recovery/request:
    post:
      tags: [Identity]
      summary: Request password recovery without disclosing account existence
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryRequest' } } }
      responses: { '200': { description: Recovery request accepted } }
  /v1/identity/auth/recovery/reset:
    post:
      tags: [Identity]
      summary: Set a new password using a single-use recovery token
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryReset' } } }
      responses: { '200': { description: Password reset } }
  /v1/identity/me:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Get the authenticated account and scopes
      responses: { '200': { description: Authenticated account } }
  /v1/identity/admin/accounts:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: List accounts for global identity administrators
      parameters:
        - { in: query, name: q, schema: { type: string } }
        - { in: query, name: status, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses: { '200': { description: Account page } }
  /v1/identity/admin/accounts/{accountId}/update:
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      deprecated: true
      summary: Edit an account and replace its active administrative roles
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                email: { type: string, format: email, nullable: true }
                participationType: { type: string, enum: [OPERATOR, SWL] }
                status: { type: string, enum: [ACTIVE, DEACTIVATED] }
                password: { type: string, minLength: 12, writeOnly: true }
                roles:
                  type: array
                  items: { $ref: '#/components/schemas/RoleAssignment' }
      responses: { '200': { description: Updated account and active roles } }
  /v1/identity/admin/roles:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: List built-in and custom administrative roles and permissions
      responses: { '200': { description: Role catalogue } }
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Create a custom administrative role
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminRoleDefinition' } } }
      responses: { '201': { description: Created role definition } }
  /v1/identity/admin/roles/{roleCode}/update:
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      deprecated: true
      summary: Edit a custom administrative role
      parameters:
        - in: path
          name: roleCode
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AdminRoleDefinition' } } }
      responses: { '200': { description: Updated role definition } }
  /v1/identity/admin/security-events:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: List security events for global identity administrators
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses: { '200': { description: Security-event page } }
  /v1/identity/accounts:
    post:
      tags: [Identity]
      summary: Create an operator or SWL account
      operationId: createAccount
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccount' }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }
  /v1/identity/accounts/{accountId}/callsigns:
    post:
      tags: [Identity]
      summary: Add and optionally verify a callsign
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddCallsign' }
      responses:
        '201': { description: Created }
  /v1/identity/accounts/{accountId}/callsigns/{callsignId}/evidence:
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Submit callsign verification evidence
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CallsignId'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CallsignEvidence' } } }
      responses: { '201': { description: Evidence submitted } }
  /v1/identity/accounts/{accountId}/callsigns/{callsignId}/verify:
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      summary: Verify callsign evidence using the callsign.verify scope
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/CallsignId'
      responses: { '200': { description: Callsign verified } }
  /v1/identity/accounts/{accountId}/roles:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses: { '200': { description: Account roles } }
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      deprecated: true
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignment' } } }
      responses: { '201': { description: Role assigned } }
  /v1/identity/accounts/{accountId}/export:
    get:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses: { '200': { description: Personal data export } }
  /v1/identity/accounts/{accountId}/deactivate:
    post:
      tags: [Identity]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses: { '200': { description: Account deactivated and sessions revoked } }
  /v1/programmes:
    get:
      tags: [Programmes]
      summary: List configured programmes
      responses:
        '200': { description: Programme list }
    post:
      tags: [Programmes]
      summary: Create a programme configuration
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Programme' }
      responses: { '201': { description: Created } }
  /v1/programmes/{slug}/policy:
    get:
      tags: [Programmes]
      summary: Get the effective programme policy version
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
      responses:
        '200': { description: Effective programme policy }
  /v1/programmes/{slug}/update:
    post:
      tags: [Programmes]
      security: [{ bearerAuth: [] }]
      deprecated: true
      summary: Update programme-owned configuration
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/ProgrammeUpdate' } } }
      responses: { '200': { description: Updated programme } }
  /v1/entity-types:
    get:
      tags: [Programmes]
      security: [{ bearerAuth: [] }]
      summary: List shared entity category master data
      responses: { '200': { description: Shared entity category catalogue } }
    post:
      tags: [Programmes]
      security: [{ bearerAuth: [] }]
      summary: Create or update a shared entity category definition
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EntityType' } } }
      responses: { '200': { description: Updated category }, '201': { description: Created category } }
  /v1/programmes/{slug}/entity-types:
    get:
      tags: [Programmes]
      security: [{ bearerAuth: [] }]
      summary: List entity categories assigned to the programme
      parameters: [{ in: path, name: slug, required: true, schema: { type: string } }]
      responses: { '200': { description: Entity category catalogue } }
    post:
      tags: [Programmes]
      security: [{ bearerAuth: [] }]
      summary: Legacy category upsert and assignment compatibility endpoint
      parameters: [{ in: path, name: slug, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EntityType' } } }
      responses: { '200': { description: Updated category }, '201': { description: Created category } }
  /v1/programmes/{slug}/entity-types/assign:
    post:
      tags: [Programmes]
      security: [{ bearerAuth: [] }]
      deprecated: true
      summary: Assign a shared entity category to a programme
      parameters: [{ in: path, name: slug, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EntityTypeAssignment' } } }
      responses: { '200': { description: Updated programme assignments } }
  /v1/programmes/{slug}/entity-types/unassign:
    post:
      tags: [Programmes]
      security: [{ bearerAuth: [] }]
      deprecated: true
      summary: Remove a shared entity category from a programme
      parameters: [{ in: path, name: slug, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EntityTypeAssignment' } } }
      responses: { '200': { description: Updated programme assignments } }
  /v1/programmes/{slug}/archive:
    post:
      tags: [Programmes]
      security: [{ bearerAuth: [] }]
      deprecated: true
      summary: Archive a programme
      parameters:
        - in: path
          name: slug
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses: { '200': { description: Archived programme } }
  /v1/geodata/entities:
    get:
      tags: [Geodata]
      summary: List verified and candidate entities
      parameters:
        - in: query
          name: programme
          schema: { type: string }
        - in: query
          name: status
          description: Repeat or comma-separate values for a multi-status filter; omit for all statuses.
          style: form
          explode: true
          schema: { type: array, items: { type: string, enum: [CANDIDATE, APPROVED, RETIRED, REJECTED] } }
        - { in: query, name: entityType, schema: { type: string } }
        - { in: query, name: continent, schema: { type: string } }
        - { in: query, name: country, schema: { type: string } }
        - { in: query, name: region, description: Provider-derived first subdivision / region name., schema: { type: string } }
        - { in: query, name: province, schema: { type: string } }
        - { in: query, name: city, description: Matches either city or municipality., schema: { type: string } }
        - { in: query, name: minLon, schema: { type: number, format: double } }
        - { in: query, name: minLat, schema: { type: number, format: double } }
        - { in: query, name: maxLon, schema: { type: number, format: double } }
        - { in: query, name: maxLat, schema: { type: number, format: double } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Entity list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GeoEntity' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
                  nextPage: { type: integer, nullable: true }
  /v1/geodata/imports/manual:
    post:
      tags: [Geodata]
      summary: Import GeoJSON features as candidates
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GeoImport' } }
      responses: { '202': { description: Import accepted } }
  /v1/geodata/imports:
    get:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: List geodata import runs
      responses: { '200': { description: Import runs } }
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Paste a text source document and queue candidate import
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GeoImport' } } }
      responses: { '202': { description: Import accepted } }
  /v1/geodata/imports/{runId}:
    get:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Get geodata import status and summary
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Import status, processing counts, source manifest, and errors
          content: { application/json: { schema: { $ref: '#/components/schemas/GeoImportRun' } } }
        '404': { description: Import run not found }
  /v1/geodata/imports/{runId}/candidates:
    get:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: List the paged pre-processed records for an import run
      description: Pre-processed records are not entities yet. They remain invisible to the entity catalogue until confirmed and promoted.
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Paged pending pre-processed import records; confirmed, rejected, and processed staging records are omitted
          content: { application/json: { schema: { $ref: '#/components/schemas/GeoImportCandidatePage' } } }
  /v1/geodata/imports/{runId}/candidates/validate:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Confirm or reject selected pre-processed records for promotion
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GeoImportCandidateValidation' } } }
      responses: { '200': { description: Selected records confirmed or rejected; rejected records are deleted from staging } }
  /v1/geodata/imports/{runId}/process:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Queue confirmed records for entity promotion
      description: The request is published to the geodata import processing subject. The target is explicitly CANDIDATE or APPROVED.
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GeoImportProcessingRequest' } } }
      responses:
        '202':
          description: Promotion queue accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/GeoImportProcessingQueue' } } }
  /v1/geodata/imports/{runId}/processed:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Finalize an import and discard staged records
      description: Idempotently removes the run's pre-processed candidate and promotion-queue rows while preserving the import summary and any already materialized entities.
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GeoImportFinalization' } } }
      responses:
        '200':
          description: Import finalized and staged records discarded
          content: { application/json: { schema: { $ref: '#/components/schemas/GeoImportRun' } } }
  /v1/geodata/imports/upload:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Upload a binary or text source document and queue candidate import
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GeoImportUpload' } } }
      responses: { '202': { description: Upload stored and import queued } }
  /v1/geodata/location-options:
    get:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: List provider-derived location hierarchy options
      description: Values are aggregated from stored BigDataCloud reverse-geocoding responses; this endpoint does not issue remote lookups.
      responses:
        '200':
          description: Searchable continent, country, subdivision, and province hierarchy
          content: { application/json: { schema: { $ref: '#/components/schemas/LocationOptions' } } }
  /v1/geodata/entities/{entityId}/review:
    post:
      tags: [Geodata]
      summary: Review a candidate entity
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reviewerId]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                reviewerId: { type: string }
                note: { type: string }
      responses: { '200': { description: Review recorded } }
  /v1/geodata/entities/{entityId}/geometry-type:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Convert a geodata entity between point, way, and polygon geometry
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geometryType, editorId]
              properties:
                geometryType: { type: string, enum: [POINT, LINESTRING, MULTILINESTRING, POLYGON, MULTIPOLYGON, WAY] }
                editorId: { type: string }
                note: { type: string }
      responses: { '200': { description: Geometry type changed and audited } }
  /v1/geodata/entities/{entityId}/location:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Save manual location metadata and its provider precedence
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/LocationMetadataEdit' } }
      responses: { '200': { description: Location metadata saved and audited } }
  /v1/geodata/entities/{entityId}/entity-type:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Change an entity category and record an audit entry
      parameters: [{ $ref: '#/components/parameters/EntityId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EntityTypeChange' } } }
      responses: { '200': { description: Category changed and audited } }
  /v1/geodata/entities/{entityId}/name:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Change an entity display name and record an audit entry
      parameters: [{ $ref: '#/components/parameters/EntityId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EntityNameChange' } } }
      responses: { '200': { description: Name changed and audited } }
  /v1/geodata/entities/{entityId}/delete:
    post:
      tags: [Geodata]
      security: [{ bearerAuth: [] }]
      summary: Permanently delete an entity and its audit record; global deletion also requires activity cascade first
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [deletedBy], properties: { deletedBy: { type: string } } } } }
      responses: { '204': { description: Entity and audit record deleted } }
  /v1/activations/admin/entities/{entityId}/deletion-impact:
    get:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Calculate the QSO and award impact of deleting an entity
      parameters: [{ $ref: '#/components/parameters/EntityId' }]
      responses: { '200': { description: Deletion impact } }
  /v1/activations/admin/entities/{entityId}/cascade-delete:
    post:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Delete linked valid QSOs and queue award recalculation
      parameters: [{ $ref: '#/components/parameters/EntityId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: QSO cascade and award recalculation result } }
  /v1/activations:
    get:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: List activations for authorised operators and administrators
      parameters:
        - in: query
          name: programme
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses: { '200': { description: Activation page } }
    post:
      tags: [Activity]
      summary: Start an activation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Activation' } } }
      responses: { '201': { description: Created } }
  /v1/activations/{activationId}:
    get:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Get an activation and its normalized QSOs
      parameters: [{ $ref: '#/components/parameters/ActivationId' }]
      responses: { '200': { description: Activation } }
  /v1/activations/{activationId}/qsos:
    post:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Record a normalized QSO for an open activation
      parameters: [{ $ref: '#/components/parameters/ActivationId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Qso' } } }
      responses: { '201': { description: QSO recorded } }
  /v1/activations/{activationId}/close:
    post:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Close an activation
      parameters: [{ $ref: '#/components/parameters/ActivationId' }]
      responses: { '200': { description: Activation closed } }
  /v1/awards:
    get:
      tags: [Awards]
      security: [{ bearerAuth: [] }]
      summary: List programme-owned award definitions
      parameters:
        - { in: query, name: programme, schema: { type: string } }
        - { in: query, name: category, schema: { type: string, enum: [HUNTER, ACTIVATOR] } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses: { '200': { description: Award definition page } }
    post:
