      security: [{ bearerAuth: [] }]
      summary: Get ADIF import status
      parameters: [{ in: path, name: importId, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: ADIF import status } }
  /v1/qsos/{qsoId}/corrections:
    post:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Request a QSO correction
      parameters: [{ in: path, name: qsoId, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses: { '201': { description: Correction request created } }
  /v1/qso-corrections/{correctionId}/review:
    post:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Review a QSO correction request
      parameters: [{ in: path, name: correctionId, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [decision, reviewedBy], additionalProperties: true } } }
      responses: { '200': { description: Correction decision recorded } }
  /v1/public/activations:
    get:
      tags: [Activity]
      summary: List public activation history
      parameters: [{ in: query, name: programme, schema: { type: string } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Public activation page } }
  /v1/public/leaderboards:
    get:
      tags: [Activity]
      summary: List public programme leaderboards
      parameters: [{ in: query, name: programme, required: true, schema: { type: string } }, { in: query, name: category, required: true, schema: { type: string } }]
      responses: { '200': { description: Public leaderboard } }
  /v1/public/results:
    get:
      tags: [Activity]
      summary: Download public activation results
      parameters: [{ in: query, name: programme, schema: { type: string } }, { in: query, name: format, schema: { type: string, enum: [json, csv] } }]
      responses: { '200': { description: Public results document } }
  /v1/statistics/rebuild:
    post:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: Queue a reproducible activity statistics rebuild
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses: { '202': { description: Statistics rebuild queued } }
  /v1/statistics:
    get:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: List precomputed activity statistics
      parameters: [{ in: query, name: programme, schema: { type: string } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Statistics page } }
  /v1/notifications:
    get:
      tags: [Activity]
      security: [{ bearerAuth: [] }]
      summary: List notifications for the authenticated account
      parameters: [{ in: query, name: recipientId, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }]
      responses: { '200': { description: Notification page } }
  /v1/awards/{awardId}/recalculate:
    post:
      tags: [Awards]
      security: [{ bearerAuth: [] }]
      summary: Queue historical award progress recalculation
      parameters: [{ $ref: '#/components/parameters/AwardId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '202': { description: Award recalculation queued } }
  /v1/awards/{awardId}/retire:
    post:
      tags: [Awards]
      security: [{ bearerAuth: [] }]
      deprecated: true
      summary: Retire an award definition
      parameters: [{ $ref: '#/components/parameters/AwardId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { description: Award retired } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 128 }
    AccountId:
      in: path
      name: accountId
      required: true
      schema: { type: string, format: uuid }
    EntityId:
      in: path
      name: entityId
      required: true
      schema: { type: string, format: uuid }
    ActivationId:
      in: path
      name: activationId
      required: true
      schema: { type: string, format: uuid }
    CallsignId:
      in: path
      name: callsignId
      required: true
      schema: { type: string, format: uuid }
    AwardId:
      in: path
      name: awardId
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      in: path
      name: requestId
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      in: path
      name: assetId
      required: true
      schema: { type: string, format: uuid }
    IssuanceId:
      in: path
      name: issuanceId
      required: true
      schema: { type: string, format: uuid }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      in: query
      name: pageSize
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  schemas:
    Account:
      type: object
      required: [id, displayName, participationType, status]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email, nullable: true }
        participationType: { type: string, enum: [OPERATOR, SWL] }
        status: { type: string, enum: [ACTIVE, DEACTIVATED] }
        callsigns: { type: array, items: { type: object } }
    RegisterAccount:
      allOf:
        - $ref: '#/components/schemas/CreateAccount'
        - type: object
          required: [email, password]
          properties:
            password: { type: string, minLength: 12, format: password }
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    RefreshToken:
      type: object
      required: [refreshToken]
      properties: { refreshToken: { type: string } }
    RecoveryRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    RecoveryReset:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string }
        newPassword: { type: string, minLength: 12, format: password }
    CallsignEvidence:
      type: object
      required: [evidenceType, source]
      properties:
        evidenceType: { type: string }
        source: { type: string }
        checksum: { type: string }
        metadata: { type: object }
    RoleAssignment:
      type: object
      required: [role]
      properties:
        role: { type: string }
        code: { type: string, description: Role-definition code accepted by administrative role replacement }
        programmeSlug: { type: string }
        jurisdiction: { type: string }
        entityType: { type: string }
        scopes: { type: array, items: { type: string } }
    AdminRoleDefinition:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$' }
        name: { type: string }
        description: { type: string }
        scopes: { type: array, uniqueItems: true, items: { type: string } }
    CreateAccount:
      type: object
      required: [displayName, participationType]
      properties:
        displayName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        participationType: { type: string, enum: [OPERATOR, SWL] }
        callsign: { type: string, description: Optional initial callsign for an operator }
    AddCallsign:
      type: object
      required: [callsign]
      properties:
        callsign: { type: string }
        status: { type: string, enum: [UNVERIFIED, VERIFIED, RETIRED] }
        source: { type: string }
    Programme:
      type: object
      required: [slug, name, entityTypes, rules]
      properties:
        slug: { type: string }
        name: { type: string }
        entityTypes: { type: array, items: { type: object } }
        rules: { type: object }
        theme: { type: object }
        oidc: { type: object, nullable: true }
    EntityType:
      type: object
      required: [code, label, geometryTypes]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$', description: Stable shared category code; it cannot be renamed. }
        originalCode: { type: string }
        label: { type: string }
        geometry: { type: string, enum: [POINT, LINESTRING, MULTILINESTRING, POLYGON, MULTIPOLYGON], deprecated: true, description: Legacy single geometry value; use geometryTypes. }
        geometryTypes: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [POINT, LINESTRING, MULTILINESTRING, POLYGON, MULTIPOLYGON] }, description: GeoJSON geometry types accepted by this category. }
        description: { type: string }
        active: { type: boolean, default: true }
    EntityTypeAssignment:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$', description: Shared category code to assign or unassign. }
    EntityTypeChange:
      type: object
      required: [entityTypes, editorId]
      properties:
        entityTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        entityTypeCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        entityType: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        editorId: { type: string }
        note: { type: string }
    EntityNameChange:
      type: object
      required: [name, editorId]
      properties:
        name: { type: string, minLength: 1, maxLength: 240 }
        editorId: { type: string }
        note: { type: string }
    ProgrammeUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        entityTypes: { type: array, items: { type: object } }
        rules: { type: object }
        theme: { type: object }
        oidc: { type: object, nullable: true }
    GeoImport:
      type: object
      required: [adapter, source, entityTypes]
      properties:
        programmeSlug: { type: string, nullable: true, description: Legacy optional scope; omit for a platform-wide import. }
        adapter: { type: string, enum: [PARKSERVE_US, OSM, GOVERNMENT_GIS, MANUAL] }
        format: { type: string, enum: [GEOJSON, KML, GPX, WFS, SHAPEFILE, SHP, ARCGIS_FEATURESERVER, OSM_PBF, PARKSERVE_US] }
        entityTypes:
          type: array
          minItems: 1
          uniqueItems: true
          description: Shared Master data category codes; imports are pre-processed first and require administrator promotion to CANDIDATE or APPROVED. The first code is the primary compatibility entityType.
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        entityTypeCodes:
          type: array
          minItems: 1
          uniqueItems: true
          description: Compatibility alias for entityTypes.
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        entityType: { type: string, deprecated: true, description: Deprecated single-category compatibility input; use entityTypes. }
        source: { type: object }
        features: { type: array, items: { type: object } }
        content: { type: string }
        filename: { type: string }
    GeoImportUpload:
      type: object
      required: [adapter, source, entityTypes, filename, contentBase64]
      properties:
        programmeSlug: { type: string, nullable: true, description: Legacy optional scope; omit for a platform-wide import. }
        adapter: { type: string, enum: [PARKSERVE_US, OSM, GOVERNMENT_GIS, MANUAL] }
        format: { type: string, enum: [GEOJSON, KML, GPX, WFS, SHAPEFILE, SHP, ARCGIS_FEATURESERVER, OSM_PBF, PARKSERVE_US] }
        entityTypes:
          type: array
          minItems: 1
          uniqueItems: true
          description: Shared Master data category codes; imports are programme-independent and enter the durable pre-processing queue before promotion.
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        entityTypeCodes:
          type: array
          minItems: 1
          uniqueItems: true
          description: Compatibility alias for entityTypes.
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        entityType: { type: string, deprecated: true, description: Deprecated single-category compatibility input; use entityTypes. }
        source: { type: object }
        filename: { type: string }
        contentBase64: { type: string, format: byte }
    GeoImportRun:
      type: object
      required: [id, status, adapter, format, entityTypes]
      properties:
        id: { type: string, format: uuid }
        programmeSlug: { type: string, nullable: true }
        adapter: { type: string }
        format: { type: string }
        filename: { type: string, nullable: true }
        entityType: { type: string, description: Primary compatibility category code }
        entityTypes: { type: array, items: { type: string } }
        source: { type: object, additionalProperties: true }
        status: { type: string, enum: [QUEUED, PROCESSING, PREPROCESSED, PREPROCESSED_WITH_ERRORS, COMPLETED, COMPLETED_WITH_ERRORS, FAILED, PROCESSED] }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        featureCount: { type: integer, nullable: true }
        stats: { type: object, additionalProperties: { type: integer } }
        manifest: { type: object, nullable: true, additionalProperties: true }
        errors: { type: array, items: { type: object, additionalProperties: true } }
        candidateCounts: { type: object, additionalProperties: { type: integer } }
        processedAt: { type: string, format: date-time, nullable: true }
        processedBy: { type: string, nullable: true }
    GeoImportCandidate:
      type: object
      required: [id, importRunId, ordinal, name, geometry, validationStatus]
      properties:
        id: { type: string, format: uuid }
        importRunId: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 0 }
        existingEntityId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        entityTypes: { type: array, items: { type: string } }
        geometry: { type: object, additionalProperties: true }
        centroid: { type: object, additionalProperties: true }
        sourceRef: { type: string, nullable: true }
        candidateSource: { type: object, additionalProperties: true }
        dedupeWarning: { type: string, enum: [POSSIBLE_DUPLICATE], nullable: true, description: Present when an existing entity has identical geometry or is within 50 metres. }
        possibleDuplicates: { type: array, items: { $ref: '#/components/schemas/GeoImportDuplicate' } }
        validationStatus: { type: string, enum: [PENDING, CONFIRMED, REJECTED, PROCESSED] }
        validationNote: { type: string, nullable: true }
        validatedBy: { type: string, nullable: true }
        validatedAt: { type: string, format: date-time, nullable: true }
        targetStatus: { type: string, enum: [CANDIDATE, APPROVED], nullable: true }
        processedEntityId: { type: string, format: uuid, nullable: true }
        processedAt: { type: string, format: date-time, nullable: true }
        location: { type: object, additionalProperties: true }
    GeoImportDuplicate:
      type: object
      required: [entityId, name, geometry, distanceMeters, matchType]
      properties:
        entityId: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, nullable: true }
        entityTypes: { type: array, items: { type: string } }
        geometry: { type: object, additionalProperties: true }
        centroid: { type: object, additionalProperties: true }
        distanceMeters: { type: number, format: double, minimum: 0, maximum: 50 }
        matchType: { type: string, enum: [IDENTICAL_GEOMETRY, WITHIN_50_METERS] }
    GeoImportCandidatePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GeoImportCandidate' } }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        nextPage: { type: integer, nullable: true }
    GeoImportCandidateValidation:
      type: object
      required: [candidateIds, reviewerId]
      properties:
        candidateIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        reviewerId: { type: string }
        validationStatus: { type: string, enum: [VALID, REJECTED], default: VALID, description: VALID confirms records for later promotion; REJECTED removes them from the import staging queue. }
        note: { type: string }
    GeoImportProcessingRequest:
      type: object
      required: [candidateIds, targetStatus, processorId]
      properties:
        candidateIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        targetStatus: { type: string, enum: [CANDIDATE, APPROVED] }
        processorId: { type: string }
        note: { type: string }
    GeoImportFinalization:
      type: object
      required: [processedBy]
      properties:
        processedBy: { type: string, description: Account or administrator identifier that finalized the run. }
        actor: { type: string, description: Compatibility alias for processedBy. }
    GeoImportProcessingQueue:
      type: object
      required: [id, importRunId, candidateIds, targetStatus, status]
      properties:
        id: { type: string, format: uuid }
        importRunId: { type: string, format: uuid }
        candidateIds: { type: array, items: { type: string, format: uuid } }
        targetStatus: { type: string, enum: [CANDIDATE, APPROVED] }
        requestedBy: { type: string }
        status: { type: string, enum: [QUEUED, PROCESSING, COMPLETED, FAILED] }
        result: { type: object, additionalProperties: true }
        error: { type: string, nullable: true }
    GeoEntity:
      type: object
      required: [id, name, status, geometry]
      properties:
        id: { type: string, format: uuid }
        programmeSlug: { type: string, nullable: true, description: Optional programme eligibility assignment. }
        entityType: { type: string }
        entityTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        entityTypeCodes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
        name: { type: string }
        status: { type: string, enum: [CANDIDATE, APPROVED, REJECTED, RETIRED] }
        candidateSource:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [ADAPTER_IMPORT, COMMUNITY_PROPOSAL] }
            adapter: { type: string, nullable: true }
            importRunId: { type: string, format: uuid, nullable: true }
            proposalId: { type: string, format: uuid, nullable: true }
            proposerId: { type: string, nullable: true }
            sourceKey: { type: string, nullable: true }
            sourceRef: { type: string, nullable: true }
        geometry: { type: object, additionalProperties: true, description: GeoJSON geometry. Ways use type LineString; the import API also accepts the non-standard geometry type alias way and normalizes it to LineString. }
        centroid: { type: object, additionalProperties: true }
        continent: { type: string, nullable: true }
        continentCode: { type: string, nullable: true, description: ISO-style continent code from the geocoder }
        country: { type: string, nullable: true }
        countryCode: { type: string, nullable: true, description: ISO 3166-1 country code }
        region: { type: string, nullable: true, description: First administrative subdivision after the country }
        regionCode: { type: string, nullable: true, description: ISO 3166-2 code for the first subdivision after the country }
        subdivision: { type: string, nullable: true }
        subdivisionCode: { type: string, nullable: true }
        province: { type: string, nullable: true }
        provinceCode: { type: string, nullable: true }
        county: { type: string, nullable: true }
        countyCode: { type: string, nullable: true }
        city: { type: string, nullable: true, description: City or municipality }
        municipality: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        manualLocationFields: { type: array, items: { type: string }, description: Fields explicitly maintained by an administrator }
        geocodeProvider: { type: string, nullable: true }
        geocodeStatus: { type: string, enum: [ENRICHED, FAILED, NOT_CONFIGURED, SKIPPED_NO_CENTROID], nullable: true }
        geocodedAt: { type: string, format: date-time, nullable: true }
        provenance: { type: object, additionalProperties: true }
    LocationMetadata:
      type: object
      additionalProperties: false
      properties:
        continent: { type: string, nullable: true }
        continentCode: { type: string, nullable: true }
        country: { type: string, nullable: true }
        countryCode: { type: string, nullable: true }
        region: { type: string, nullable: true }
        regionCode: { type: string, nullable: true }
        subdivision: { type: string, nullable: true }
        subdivisionCode: { type: string, nullable: true }
        province: { type: string, nullable: true }
        provinceCode: { type: string, nullable: true }
        county: { type: string, nullable: true }
        countyCode: { type: string, nullable: true }
        city: { type: string, nullable: true }
        municipality: { type: string, nullable: true }
        locality: { type: string, nullable: true }
    LocationOptions:
      type: object
      required: [provider, continents]
      properties:
        provider: { type: string, example: BIGDATACLOUD }
        codeStandards: { type: object, additionalProperties: { type: string } }
        continents:
          type: array
          items:
            type: object
            required: [name, countries]
            properties:
              name: { type: string }
              code: { type: string, nullable: true }
              countries:
                type: array
                items:
                  type: object
                  required: [name, subdivisions]
                  properties:
                    name: { type: string }
                    code: { type: string, nullable: true }
                    subdivisions:
                      type: array
                      items:
                        type: object
                        required: [name, provinces]
                        properties:
                          name: { type: string }
                          code: { type: string, nullable: true }
                          provinces:
                            type: array
                            items:
                              type: object
                              required: [name]
                              properties:
                                name: { type: string }
                                code: { type: string, nullable: true }
    LocationMetadataEdit:
      type: object
      required: [location, editorId]
      properties:
        location:
          allOf:
            - $ref: '#/components/schemas/LocationMetadata'
          description: Stable GeoEntity location fields; null clears a manual value.
        manualFields:
          type: array
          items: { type: string, enum: [continent, country, region, subdivision, province, county, city, municipality, locality] }
          description: Fields that remain authoritative over reverse-geocoding refreshes.
        editorId: { type: string }
        note: { type: string }
    Activation:
      type: object
      required: [programmeSlug, entityId, operatorId, startedAt]
      properties:
        programmeSlug: { type: string }
        entityId: { type: string, format: uuid }
        operatorId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        entityType: { type: string }
        location: { type: object, additionalProperties: true }
    Qso:
      type: object
      required: [workedCallsign, timestamp]
      properties:
        workedCallsign: { type: string }
        timestamp: { type: string, format: date-time }
        band: { type: string }
        mode: { type: string }
        rst: { type: string }
        hunterId: { type: string, format: uuid }
        workedEntityId: { type: string, format: uuid }
        source: { type: string }
    AwardCondition:
      description: Programme-owned recursive AND/OR condition tree.
      oneOf:
        - type: object
          required: [kind, conditions]
          properties:
            kind: { type: string, enum: [AND, OR, ALL, ANY] }
            conditions: { type: array, items: { $ref: '#/components/schemas/AwardCondition' }, minItems: 1 }
        - type: object
          required: [kind, operator, value]
          properties:
            kind: { type: string, enum: [QSO_COUNT, ACTIVATION_COUNT, UNIQUE_CALLSIGNS, UNIQUE_ENTITIES, FIELD] }
            field: { type: string }
            operator: { type: string, enum: [GTE, GT, EQ, LTE, LT] }
            value: { type: number }
        - type: object
          required: [kind, values]
          properties:
            kind: { type: string, enum: [ENTITY_TYPE] }
            values: { type: array, items: { type: string }, minItems: 1 }
        - type: object
          required: [kind, condition]
          properties:
            kind: { type: string, enum: [NOT] }
            condition: { $ref: '#/components/schemas/AwardCondition' }
    AwardLevel:
      type: object
      required: [id, name, threshold]
      properties:
        id: { type: string }
        name: { type: string }
        threshold: { type: number, exclusiveMinimum: 0 }
    AwardAsset:
      type: object
      required: [kind, name, objectKey, mediaType, widthPx, heightPx]
      properties:
        assetId: { type: string, format: uuid }
        kind: { type: string, enum: [BACKGROUND, SIGNATURE] }
        name: { type: string }
        objectKey: { type: string }
        mediaType: { type: string, pattern: '^image/' }
        widthPx: { type: integer, minimum: 1 }
        heightPx: { type: integer, minimum: 1 }
        sha256: { type: string }
        bucket: { type: string }
    AwardTemplateElement:
      type: object
      required: [kind, x, y, width, height]
      properties:
        kind: { type: string, enum: [AWARD_NAME, CALLSIGN, PERSON_NAME, DATE_OBTAINED, MANAGER_NAME, MANAGER_SIGNATURE] }
        x: { type: number, minimum: 0, maximum: 1 }
        y: { type: number, minimum: 0, maximum: 1 }
        width: { type: number, exclusiveMinimum: 0, maximum: 1 }
        height: { type: number, exclusiveMinimum: 0, maximum: 1 }
        style: { type: object }
    AwardTemplate:
      type: object
      required: [elements]
      properties:
        elements: { type: array, minItems: 6, items: { $ref: '#/components/schemas/AwardTemplateElement' } }
    AwardPrintSpec:
      type: object
      properties:
        page: { type: string, enum: [A4, LETTER], default: A4 }
        orientation: { type: string, enum: [PORTRAIT, LANDSCAPE], default: PORTRAIT }
        dpi: { type: integer, minimum: 150, default: 300 }
    AwardDefinition:
      type: object
      required: [programmeSlug, code, name, category, condition, levels, backgroundAsset, template]
      properties:
        awardId: { type: string, format: uuid }
        programmeSlug: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string }
        category: { type: string, enum: [HUNTER, ACTIVATOR] }
        achievementMetric: { type: string, enum: [QSO_COUNT, ACTIVATION_COUNT, UNIQUE_CALLSIGNS, UNIQUE_ENTITIES] }
        condition: { $ref: '#/components/schemas/AwardCondition' }
        levels: { type: array, minItems: 1, items: { $ref: '#/components/schemas/AwardLevel' } }
        backgroundAsset: { $ref: '#/components/schemas/AwardAsset' }
        printSpec: { $ref: '#/components/schemas/AwardPrintSpec' }
        template: { $ref: '#/components/schemas/AwardTemplate' }
    AwardReview:
      type: object
      required: [decision, reviewerId]
      properties:
        decision: { type: string, enum: [APPROVED, CHANGES_REQUESTED] }
        reviewerId: { type: string }
        note: { type: string }
    AwardPublication:
      type: object
      required: [effectiveFrom, publisherId]
      properties:
        effectiveFrom: { type: string, format: date-time }
        publisherId: { type: string }
    AwardEvaluationRequest:
      type: object
      required: [awardId, subjectId, facts]
      properties:
        awardId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        facts: { type: object, additionalProperties: true }
    AwardProgressRequest:
      type: object
      required: [awardId, subjectId]
      properties:
        awardId: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
    AwardRequest:
      type: object
      required: [awardId, levelId, subjectId, callsign, personName]
      properties:
        awardId: { type: string, format: uuid }
        levelId: { type: string }
        subjectId: { type: string, format: uuid }
        callsign: { type: string }
        personName: { type: string }
        facts: { type: object, additionalProperties: true, description: Optional facts for trusted service/admin callers; participant requests use server-side activity facts. }
    AwardIssuanceRequest:
      type: object
      required: [managerName, signatureAssetId]
      properties:
        managerName: { type: string }
        signatureAssetId: { type: string, format: uuid }
        dateObtained: { type: string, format: date-time }
    AssetContent:
      type: object
      required: [contentBase64]
      properties:
        contentBase64: { type: string, contentEncoding: base64 }
