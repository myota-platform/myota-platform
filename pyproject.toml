[project]
name = "myota-platform"
version = "0.1.0"
description = "API-first Outdoor Activation Platform vertical slice"
requires-python = ">=3.11"

[tool.unittest]
start-directory = "tests"

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
