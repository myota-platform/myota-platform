---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.fullname" (dict "name" "prometheus") }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: prometheus}
      annotations:
        checksum/prometheus-config: {{ printf "%s%s" (.Files.Get "observability/prometheus.yml") (.Files.Get "observability/rules.yml") | sha256sum | quote }}
    spec:
      securityContext: {fsGroup: 65534}
      containers:
        - name: prometheus
          image: {{ .Values.observability.prometheus.image }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time={{ .Values.observability.prometheus.retention }}"]
          ports: [{name: http, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
            - {name: config, mountPath: /etc/prometheus/rules.yml, subPath: rules.yml}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: {{ include "myota.fullname" (dict "name" "observability") }}}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "myota.fullname" (dict "name" "prometheus-data") }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myota.fullname" (dict "name" "prometheus") }}
spec:
  selector: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: prometheus}
  ports: [{name: http, port: {{ .Values.observability.prometheus.servicePort }}, targetPort: http}]
---
