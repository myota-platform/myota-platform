{{- if .Values.observability.enabled }}
{{- $storage := dict "tempo" .Values.observability.tempo.storageSize "loki" .Values.observability.loki.workingStorageSize "prometheus" .Values.observability.prometheus.storageSize "alertmanager" .Values.observability.alertmanager.storageSize "grafana" .Values.observability.grafana.storageSize }}
{{- range $component, $size := $storage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "myota.fullname" (dict "name" (printf "%s-data" $component)) }}
  labels: {app.kubernetes.io/name: {{ include "myota.name" $ }}, app.kubernetes.io/component: {{ $component }}}
spec:
  accessModes: [ReadWriteOnce]
  {{- if $.Values.observability.storageClassName }}
  storageClassName: {{ $.Values.observability.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $size | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myota.fullname" (dict "name" "observability") }}
data:
  loki.yaml: |
{{ tpl (.Files.Get "observability/loki.yaml") . | indent 4 }}
  otel-collector.yaml: |
{{ tpl (.Files.Get "observability/otel-collector.yaml") . | indent 4 }}
  tempo.yaml: |
{{ .Files.Get "observability/tempo.yaml" | indent 4 }}
  prometheus.yml: |
{{ .Files.Get "observability/prometheus.yml" | indent 4 }}
  rules.yml: |
{{ .Files.Get "observability/rules.yml" | indent 4 }}
  alertmanager.yml: |
{{ .Files.Get "observability/alertmanager.yml" | indent 4 }}
  dashboards.yml: |
{{ .Files.Get "observability/grafana/provisioning/dashboards/dashboards.yml" | indent 4 }}
  datasources.yml: |
{{ .Files.Get "observability/grafana/provisioning/datasources/datasources.yml" | indent 4 }}
  myota-operations.json: |
{{ .Files.Get "observability/grafana/dashboards/myota-operations.json" | indent 4 }}
  myota-api-performance.json: |
{{ .Files.Get "observability/grafana/dashboards/myota-api-performance.json" | indent 4 }}
  myota-geodata-capacity.json: |
{{ .Files.Get "observability/grafana/dashboards/myota-geodata-capacity.json" | indent 4 }}
  myota-object-storage.json: |
{{ .Files.Get "observability/grafana/dashboards/myota-object-storage.json" | indent 4 }}
  myota-logs-failures.json: |
{{ .Files.Get "observability/grafana/dashboards/myota-logs-failures.json" | indent 4 }}
  alert-rules.yml: |
{{ .Files.Get "observability/grafana/provisioning/alerting/alert-rules.yml" | indent 4 }}
  contact-points.yml: |
{{ .Files.Get "observability/grafana/provisioning/alerting/contact-points.yml" | indent 4 }}
  policies.yml: |
{{ .Files.Get "observability/grafana/provisioning/alerting/policies.yml" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "myota.fullname" (dict "name" "postgres-monitor-role") }}-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "myota.name" . }}
        app.kubernetes.io/component: postgres-monitor-role
    spec:
      restartPolicy: Never
      containers:
        - name: grant-monitor
          image: {{ .Values.migrations.waitImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready -h myota-core-postgres -U "$POSTGRES_USER" -d postgres; do sleep 2; done
              until pg_isready -h myota-activity-postgres -U "$POSTGRES_USER" -d postgres; do sleep 2; done
              until pg_isready -h myota-geo-postgis -U "$POSTGRES_USER" -d postgres; do sleep 2; done
              psql --no-password -h myota-core-postgres -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 <<'SQL'
              getenv monitor_password MYOTA_PG_CORE_MONITOR_PASSWORD
              SELECT format('CREATE ROLE myota_observability LOGIN PASSWORD %L', :'monitor_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'myota_observability')
              gexec
              ALTER ROLE myota_observability LOGIN PASSWORD :'monitor_password';
              GRANT CONNECT ON DATABASE myota_core TO myota_observability;
              GRANT SELECT ON pg_catalog.pg_stat_database TO myota_observability;
              SQL
              psql --no-password -h myota-activity-postgres -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 <<'SQL'
              getenv monitor_password MYOTA_PG_ACTIVITY_MONITOR_PASSWORD
              SELECT format('CREATE ROLE myota_observability LOGIN PASSWORD %L', :'monitor_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'myota_observability')
              gexec
              ALTER ROLE myota_observability LOGIN PASSWORD :'monitor_password';
              GRANT CONNECT ON DATABASE myota_activity TO myota_observability;
              GRANT SELECT ON pg_catalog.pg_stat_database TO myota_observability;
              SQL
              psql --no-password -h myota-geo-postgis -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 <<'SQL'
              getenv monitor_password MYOTA_PG_GEO_MONITOR_PASSWORD
              SELECT format('CREATE ROLE myota_observability LOGIN PASSWORD %L', :'monitor_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'myota_observability')
              gexec
              ALTER ROLE myota_observability LOGIN PASSWORD :'monitor_password';
              GRANT CONNECT ON DATABASE myota_geo TO myota_observability;
              GRANT SELECT ON pg_catalog.pg_stat_database TO myota_observability;
              SQL
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret }}
                  key: password
            - name: MYOTA_PG_CORE_MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myota-postgres-monitor-core
                  key: password
            - name: MYOTA_PG_ACTIVITY_MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myota-postgres-monitor-activity
                  key: password
            - name: MYOTA_PG_GEO_MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myota-postgres-monitor-geo
                  key: password
{{- if .Values.observability.natsSurveyor.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myota.fullname" (dict "name" "nats-dashboards") }}
data:
{{ (.Files.Glob "observability/grafana/dashboards/nats/*.json").AsConfig | indent 2 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.fullname" (dict "name" "loki") }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: loki}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: loki}
      annotations:
        checksum/config: {{ tpl (.Files.Get "observability/loki.yaml") . | sha256sum | quote }}
    spec:
      securityContext: {fsGroup: 10001}
      initContainers:
        - name: ensure-loki-bucket
          image: {{ .Values.observability.loki.bucketInitImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              if aws s3api head-bucket
              --bucket {{ .Values.observability.loki.bucketName }}
              --endpoint-url {{ .Values.objectStorage.endpoint | quote }}
              --region us-east-1 2>/dev/null; then exit 0; fi;
              aws s3api create-bucket
              --bucket {{ .Values.observability.loki.bucketName }}
              --endpoint-url {{ .Values.objectStorage.endpoint | quote }}
              --region us-east-1
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.existingSecret }}
                  key: {{ .Values.objectStorage.accessKeyKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.existingSecret }}
                  key: {{ .Values.objectStorage.secretKeyKey }}
      containers:
        - name: loki
          image: {{ .Values.observability.loki.image | quote }}
          args: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.existingSecret }}
                  key: {{ .Values.objectStorage.accessKeyKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.existingSecret }}
                  key: {{ .Values.objectStorage.secretKeyKey }}
          ports:
            - {name: http, containerPort: {{ .Values.observability.loki.servicePort }}}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml .Values.observability.loki.resources | indent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/loki/config.yaml, subPath: loki.yaml}
            - {name: data, mountPath: /var/loki}
      volumes:
        - name: config
          configMap: {name: {{ include "myota.fullname" (dict "name" "observability") }}}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "myota.fullname" (dict "name" "loki-data") }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myota.fullname" (dict "name" "loki") }}
spec:
  selector: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: loki}
  ports:
    - {name: http, port: {{ .Values.observability.loki.servicePort }}, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.fullname" (dict "name" "otel-collector") }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: otel-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: otel-collector}
      annotations:
        checksum/config: {{ tpl (.Files.Get "observability/otel-collector.yaml") . | sha256sum | quote }}
    spec:
      containers:
        - name: otel-collector
          image: {{ .Values.observability.otelCollector.image }}
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          env:
            - name: MYOTA_PG_CORE_MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myota-postgres-monitor-core
                  key: password
            - name: MYOTA_PG_ACTIVITY_MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myota-postgres-monitor-activity
                  key: password
            - name: MYOTA_PG_GEO_MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: myota-postgres-monitor-geo
                  key: password
          ports:
            - {name: otlp-grpc, containerPort: 4317}
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8889}
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol-contrib/config.yaml, subPath: otel-collector.yaml}
      volumes:
        - name: config
          configMap: {name: {{ include "myota.fullname" (dict "name" "observability") }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myota.fullname" (dict "name" "otel-collector") }}
spec:
  selector: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: otel-collector}
  ports:
    - {name: otlp-grpc, port: {{ .Values.observability.otelCollector.servicePort }}, targetPort: otlp-grpc}
    - {name: metrics, port: {{ .Values.observability.otelCollector.metricsPort }}, targetPort: metrics}
---
apiVersion: apps/v1
