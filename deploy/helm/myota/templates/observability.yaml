          livenessProbe: {httpGet: {path: /-/healthy, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml}
            - {name: data, mountPath: /alertmanager}
      volumes:
        - name: config
          configMap: {name: {{ include "myota.fullname" (dict "name" "observability") }}}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "myota.fullname" (dict "name" "alertmanager-data") }}}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  selector: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: alertmanager}
  ports: [{name: http, port: {{ .Values.observability.alertmanager.servicePort }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "myota.fullname" (dict "name" "grafana") }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: grafana}
      # Dashboard and provisioning files are mounted with subPath. Kubernetes
      # does not refresh those mounts when a ConfigMap changes, so roll Grafana
      # whenever any provisioned Grafana file changes.
      annotations:
        checksum/grafana-config: {{ (.Files.Glob "observability/grafana/**").AsConfig | sha256sum | quote }}
    spec:
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: {{ .Values.observability.grafana.image }}
          env:
            - {name: GF_DATE_FORMATS_DEFAULT_TIMEZONE, value: UTC}
            - {name: GF_SERVER_ROOT_URL, value: "%(protocol)s://%(domain)s/observability/"}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            - {name: GF_AUTH_PROXY_ENABLED, value: "true"}
            - {name: GF_AUTH_PROXY_HEADER_NAME, value: X-WEBAUTH-USER}
            - {name: GF_AUTH_PROXY_HEADER_PROPERTY, value: username}
            - {name: GF_AUTH_PROXY_AUTO_SIGN_UP, value: "true"}
            - {name: GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN, value: "false"}
            - {name: GF_AUTH_PROXY_SYNC_TTL, value: "0"}
            - {name: GF_AUTH_PROXY_HEADERS, value: "Name:X-WEBAUTH-NAME Email:X-WEBAUTH-EMAIL Role:X-WEBAUTH-ROLE"}
            - {name: GF_USERS_AUTO_ASSIGN_ORG_ROLE, value: Viewer}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/alerting/alert-rules.yml, subPath: alert-rules.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/alerting/contact-points.yml, subPath: contact-points.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/alerting/policies.yml, subPath: policies.yml}
            - {name: config, mountPath: /etc/grafana/dashboards/myota-operations.json, subPath: myota-operations.json}
            - {name: config, mountPath: /etc/grafana/dashboards/myota-api-performance.json, subPath: myota-api-performance.json}
            - {name: config, mountPath: /etc/grafana/dashboards/myota-geodata-capacity.json, subPath: myota-geodata-capacity.json}
            - {name: config, mountPath: /etc/grafana/dashboards/myota-object-storage.json, subPath: myota-object-storage.json}
            - {name: config, mountPath: /etc/grafana/dashboards/myota-logs-failures.json, subPath: myota-logs-failures.json}
            - {name: nats-dashboards, mountPath: /etc/grafana/dashboards-nats}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - name: config
          configMap: {name: {{ include "myota.fullname" (dict "name" "observability") }}}
        - name: nats-dashboards
          configMap: {name: {{ include "myota.fullname" (dict "name" "nats-dashboards") }}}
        - name: data
          persistentVolumeClaim: {claimName: {{ include "myota.fullname" (dict "name" "grafana-data") }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myota.fullname" (dict "name" "grafana") }}
spec:
  selector: {app.kubernetes.io/name: {{ include "myota.name" . }}, app.kubernetes.io/component: grafana}
  ports: [{name: http, port: {{ .Values.observability.grafana.servicePort }}, targetPort: http}]
{{- end }}

{{- if .Values.observability.natsSurveyor.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myota-nats-surveyor
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: nats-surveyor}
  template:
    metadata:
      labels: {app.kubernetes.io/name: myota, app.kubernetes.io/component: nats-surveyor}
    spec:
      containers:
        - name: nats-surveyor
          image: {{ .Values.observability.natsSurveyor.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - "--servers={{ .Values.nats.url }}"
            - "--port={{ .Values.observability.natsSurveyor.port }}"
            - "--jsz=all"
            - "--jsz-leaders-only"
            - "--jsz-filter=consumer_num_pending,consumer_num_ack_pending,consumer_num_waiting"
            - "--accounts"
          env:
            - name: NATS_SURVEYOR_USER
              value: {{ .Values.nats.systemAccount.username | quote }}
            - name: NATS_SURVEYOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.observability.natsSurveyor.existingSecret | quote }}
                  key: password
          ports:
            - {name: metrics, containerPort: {{ .Values.observability.natsSurveyor.port }}}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
{{ toYaml .Values.observability.natsSurveyor.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: myota-nats-surveyor
spec:
  selector: {app.kubernetes.io/name: myota, app.kubernetes.io/component: nats-surveyor}
  ports:
    - {name: metrics, port: {{ .Values.observability.natsSurveyor.port }}, targetPort: metrics}
{{- end }}
