apiVersion: batch/v1
kind: Job
metadata:
  name: myota-migrations-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/bash", "/app/db/migrations/run.sh"]
          env:
            - name: PGHOST
              value: {{ .Values.postgres.host | quote }}
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.existingSecret }}, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.postgres.existingSecret }}, key: password}}
            - name: PGDATABASE
              value: {{ .Values.postgres.coreDatabase | quote }}
