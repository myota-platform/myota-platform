receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
  postgresql/core:
    endpoint: myota-core-postgres:5432
    username: myota_observability
    password: ${env:MYOTA_PG_CORE_MONITOR_PASSWORD}
    databases: [myota_core]
    collection_interval: 30s
    events:
      db.server.query_sample: {enabled: false}
      db.server.top_query: {enabled: false}
    metrics:
      postgresql.bgwriter.buffers.allocated: {enabled: false}
      postgresql.bgwriter.buffers.writes: {enabled: false}
      postgresql.bgwriter.checkpoint.count: {enabled: false}
      postgresql.bgwriter.duration: {enabled: false}
      postgresql.bgwriter.maxwritten: {enabled: false}
      postgresql.blocks_read: {enabled: false}
      postgresql.database.count: {enabled: false}
      postgresql.index.scans: {enabled: false}
      postgresql.index.size: {enabled: false}
      postgresql.operations: {enabled: false}
      postgresql.replication.data_delay: {enabled: false}
      postgresql.rows: {enabled: false}
      postgresql.table.count: {enabled: false}
      postgresql.table.size: {enabled: false}
      postgresql.table.vacuum.count: {enabled: false}
      postgresql.wal.age: {enabled: false}
      postgresql.wal.lag: {enabled: false}
      postgresql.deadlocks: {enabled: true}
  postgresql/activity:
    endpoint: myota-activity-postgres:5432
    username: myota_observability
    password: ${env:MYOTA_PG_ACTIVITY_MONITOR_PASSWORD}
    databases: [myota_activity]
    collection_interval: 30s
    events:
      db.server.query_sample: {enabled: false}
      db.server.top_query: {enabled: false}
    metrics:
      postgresql.bgwriter.buffers.allocated: {enabled: false}
      postgresql.bgwriter.buffers.writes: {enabled: false}
      postgresql.bgwriter.checkpoint.count: {enabled: false}
      postgresql.bgwriter.duration: {enabled: false}
      postgresql.bgwriter.maxwritten: {enabled: false}
      postgresql.blocks_read: {enabled: false}
      postgresql.database.count: {enabled: false}
      postgresql.index.scans: {enabled: false}
      postgresql.index.size: {enabled: false}
      postgresql.operations: {enabled: false}
      postgresql.replication.data_delay: {enabled: false}
      postgresql.rows: {enabled: false}
      postgresql.table.count: {enabled: false}
      postgresql.table.size: {enabled: false}
      postgresql.table.vacuum.count: {enabled: false}
      postgresql.wal.age: {enabled: false}
      postgresql.wal.lag: {enabled: false}
      postgresql.deadlocks: {enabled: true}
  postgresql/geo:
    endpoint: myota-geo-postgis:5432
    username: myota_observability
    password: ${env:MYOTA_PG_GEO_MONITOR_PASSWORD}
    databases: [myota_geo]
    collection_interval: 30s
    events:
      db.server.query_sample: {enabled: false}
      db.server.top_query: {enabled: false}
    metrics:
      postgresql.bgwriter.buffers.allocated: {enabled: false}
      postgresql.bgwriter.buffers.writes: {enabled: false}
      postgresql.bgwriter.checkpoint.count: {enabled: false}
      postgresql.bgwriter.duration: {enabled: false}
      postgresql.bgwriter.maxwritten: {enabled: false}
      postgresql.blocks_read: {enabled: false}
      postgresql.database.count: {enabled: false}
      postgresql.index.scans: {enabled: false}
      postgresql.index.size: {enabled: false}
      postgresql.operations: {enabled: false}
      postgresql.replication.data_delay: {enabled: false}
      postgresql.rows: {enabled: false}
      postgresql.table.count: {enabled: false}
      postgresql.table.size: {enabled: false}
      postgresql.table.vacuum.count: {enabled: false}
      postgresql.wal.age: {enabled: false}
      postgresql.wal.lag: {enabled: false}
      postgresql.deadlocks: {enabled: true}
  prometheus:
    config:
      scrape_configs:
        - job_name: myota-services
          scrape_interval: 15s
          static_configs:
            - targets: [myota-gateway:8080, myota-geodata:8003, myota-activity:8004, myota-myota-activity-notifications:9110]
        - job_name: myota-identity
          scrape_interval: 15s
          static_configs:
            - targets: [myota-identity:8001]
        - job_name: myota-programmes
          scrape_interval: 15s
          static_configs:
            - targets: [myota-programmes:8002]
        - job_name: myota-outbox
          scrape_interval: 15s
          static_configs:
            - targets: [myota-core-outbox-metrics:9108, myota-activity-outbox-metrics:9108, myota-geo-outbox-metrics:9108]
        - job_name: seaweedfs
          scrape_interval: 15s
          static_configs:
            - targets: [myota-seaweedfs:{{ .Values.seaweedfs.metricsPort }}]
        - job_name: loki
          scrape_interval: 15s
          static_configs:
            - targets: [myota-loki:3100]
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 256, spike_limit_mib: 64}
  transform/drop_db_query_text:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.query.text")
          - delete_key(attributes, "db.query.parameters")
  batch: {timeout: 5s, send_batch_size: 512}
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion: {enabled: true}
  otlp/tempo:
    endpoint: myota-tempo:4317
    tls: {insecure: true}
  otlphttp/loki:
    endpoint: http://myota-loki:3100/otlp
    timeout: 10s
    sending_queue: {enabled: true, queue_size: 1024}
    retry_on_failure: {enabled: true}
service:
  pipelines:
    metrics: {receivers: [otlp, prometheus, postgresql/core, postgresql/activity, postgresql/geo], processors: [memory_limiter, batch], exporters: [prometheus]}
    traces: {receivers: [otlp], processors: [memory_limiter, transform/drop_db_query_text, batch], exporters: [otlp/tempo]}
    logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/loki]}
