receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
  prometheus:
    config:
      scrape_configs:
        - job_name: myota-services
          scrape_interval: 15s
          static_configs:
            - targets: [myota-gateway:8080, myota-identity:8001, myota-programmes:8002, myota-geodata:8003, myota-activity:8004, myota-operations:8005]
processors:
  memory_limiter: {check_interval: 1s, limit_mib: 256, spike_limit_mib: 64}
  batch: {timeout: 5s, send_batch_size: 512}
exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion: {enabled: true}
  otlp/tempo:
    endpoint: myota-tempo:4317
    tls: {insecure: true}
  debug: {verbosity: basic}
service:
  pipelines:
    metrics: {receivers: [otlp, prometheus], processors: [memory_limiter, batch], exporters: [prometheus]}
    traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/tempo, debug]}
    logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug]}
