image:
  repository: ghcr.io/myota-platform/myota-service
  tag: latest
  pullPolicy: IfNotPresent
gateway:
  imageRepository: ghcr.io/myota-platform/myota-gateway
  serviceType: ClusterIP
  port: 8080
services:
  identity: {port: 8001}
  programmes: {port: 8002}
  geodata: {port: 8003}
  activity: {port: 8004}
postgres:
  host: postgis
  coreDatabase: myota_core
  geoDatabase: myota_geo
  existingSecret: myota-postgres
auth:
  environment: production
  existingSecret: myota-auth
  maintenanceEnabled: true
nats:
  image: nats:2.10-alpine
  url: nats://myota-nats:4222
outbox:
  enabled: true
  maxAttempts: 12
resources: {}
